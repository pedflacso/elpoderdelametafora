<script>
/* Lógica del prototipo: sin dependencias ni peticiones a servicios externos. */
'use strict';
const C=JSON.parse(document.getElementById('contenido').textContent);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// Solo las menciones editoriales de estos autores abren la referencia.
function bibliographyMention(text){return esc(text).replace(/Aristóteles(?: \(1974\))?|Lakoff y Johnson(?: \(1980\/2004\))?|Lakoff, G\., &amp; Johnson, M\.|Odetti(?: \(2012\)|, V\.)?/g,name=>`<button type="button" class="bibliography-trigger" data-bibliography="${name.startsWith('Aristóteles')?'aristotle':name.startsWith('Odetti')?'odetti':'lakoff'}" aria-haspopup="dialog" aria-controls="bibliography-dialog" aria-label="${name}. Consultar referencia bibliográfica">${name}</button>`);}
const paras=xs=>xs.map(x=>`<p>${bibliographyMention(x)}</p>`).join('');
const details=xs=>xs.map(x=>`<details><summary>${esc(x.title)}</summary><p>${esc(x.body)}</p></details>`).join('');
/* Las definiciones breves se leen de corrido, sin abrir cada título. */
const briefDefinitions=xs=>`<dl class="brief-definitions">${xs.map(x=>`<div><dt>${esc(x.title)}</dt><dd>${esc(x.body)}</dd></div>`).join('')}</dl>`;

/* SVG original: las dos tarjetas representan piezas del caso. */
/* Las imágenes de tinta y las conexiones viven en capas separadas. Las etiquetas siguen siendo texto. */
function inkThreadPath(index,stage){
 if(stage==='eclosion')return ['M350 255 C290 280 235 145 95 115','M350 255 C405 220 460 380 610 390'][index];
 const ends=[[105,75],[595,75],[105,250],[595,250],[105,425],[595,425]];

}

function previousInkImage(stage){const previous={crisalida:'larva',eclosion:'crisalida',mariposa:'eclosion'}[stage];if(!previous)return '';const art=C.inkArt[previous];return `<img class="ink-previous" src="${esc(art.src)}" width="${art.width}" height="${art.height}" alt="" aria-hidden="true" loading="eager" fetchpriority="low" decoding="async">`;}
function stageArtwork(stage,{definitions=false,captionId='',caption=true}={}){
 const t=C.inkArt[stage],isCase=stage==='eclosion';
 const nodes=isCase?[{name:'Actividad',meaning:''},{name:'Guía',meaning:''}]:C.components;
 return `<figure class="ink-stage ink-${stage}${definitions?' ink-with-definitions':''}" data-ink-stage="${stage}"><div class="ink-canvas${stage!=='larva'?' ink-transition':''}"${stage!=='larva'?` data-ink-transition="${stage}"`:''}>${previousInkImage(stage)}<img class="ink-original ink-current" src="${esc(t.src)}" width="${t.width}" height="${t.height}" alt="${esc(t.alt)}" loading="${['larva','crisalida'].includes(stage)?'eager':'lazy'}" fetchpriority="${stage==='larva'?'high':'low'}" decoding="async"><svg class="ink-threads" viewBox="0 0 700 500" preserveAspectRatio="none" aria-hidden="true">${nodes.map((node,i)=>`<path class="ink-thread segment" data-component="${i}" d="${inkThreadPath(i,stage)}" pathLength="1"/>`).join('')}</svg>${isCase?'<span class="ink-case-question" aria-hidden="true">?</span>':''}<dl class="ink-annotations" aria-label="${esc(isCase?'Piezas del caso':'Partes del objeto de aprendizaje')}">${nodes.map((node,i)=>`<div class="ink-node ink-node-${i} segment" data-component="${i}"><dt>${esc(node.name)}</dt>${definitions?`<dd>${esc(node.meaning)}</dd>`:''}</div>`).join('')}</dl></div>${caption?`<figcaption${captionId?` id="${captionId}"`:''}>${esc(t.caption)}</figcaption>`:''}</figure>`;

// Solo se dibujan los hilos con el desplazamiento. Las imágenes y etiquetas nunca se ocultan.
let inkMotionFrame=0;
function refreshInkMotion(){
 const reduced=media.matches||userReduced,height=window.innerHeight;
 document.querySelectorAll('[data-ink-stage]').forEach(scene=>{
  const rect=scene.getBoundingClientRect();
  // Larva completa los hilos al entrar: la relación debe verse antes de empezar a leer las partes.
  const isLarva=scene.dataset.inkStage==='larva';
  const start=isLarva?height*1.15:height*.92;
  const distance=isLarva?height*.25:height*.65+Math.min(rect.height,height)*.25;
  const progress=reduced?1:Math.max(0,Math.min(1,(start-rect.top)/distance));
  scene.style.setProperty('--ink-progress',String(progress));
  scene.classList.toggle('ink-motion',!reduced);

  if(frame){
   const frameRect=frame.getBoundingClientRect(),current=frame.querySelector('.ink-current'),previous=frame.querySelector('.ink-previous');

   const formProgress=reduced?1:ready?Math.max(0,Math.min(1,(height*1.05-frameRect.top)/(height*.5))):0;
   frame.style.setProperty('--form-progress',String(formProgress));
   frame.classList.toggle('is-transforming',!reduced&&formProgress<1&&Boolean(previous?.complete&&previous.naturalWidth>0));
  }
 });
}

function visual(){const t=C.eclosionReveal,art=C.inkArt.eclosion;return `<aside class="visual ink-stage-panel eclosion-reveal-panel" id="case-visual"><figure class="eclosion-reveal" data-ink-stage="eclosion" aria-labelledby="eclosion-reveal-title"><p class="eclosion-kicker">${esc(t.eyebrow)}</p><h3 id="eclosion-reveal-title">${esc(t.title)}</h3><div class="eclosion-opening ink-transition" data-ink-transition="eclosion">${previousInkImage('eclosion')}<svg class="eclosion-shell" viewBox="0 0 600 360" aria-hidden="true"><path class="shell-left" d="M294 28C175 43 112 120 130 210c12 64 74 112 149 127"/><path class="shell-right" d="M306 28c119 15 182 92 164 182-12 64-74 112-149 127"/><path class="shell-thread" d="M105 120c-45 20-49 63-14 76m418-76c45 20 49 63 14 76"/></svg><span class="eclosion-wing-color eclosion-wing-left" style="--eclosion-mask:url('${esc(art.src)}')" aria-hidden="true"></span><span class="eclosion-wing-color eclosion-wing-right" style="--eclosion-mask:url('${esc(art.src)}')" aria-hidden="true"></span><img class="eclosion-art ink-current" src="${esc(art.src)}" width="${art.width}" height="${art.height}" alt="${esc(art.alt)}" loading="lazy" decoding="async"></div><svg class="eclosion-trails" viewBox="0 0 600 70" preserveAspectRatio="none" aria-hidden="true"><path class="ink-thread" d="M300 0C295 40 145 2 145 68" pathLength="1"/><path class="ink-thread" d="M300 0C305 40 455 2 455 68" pathLength="1"/></svg><div class="eclosion-pieces">${t.pieces.map(piece=>`<div class="eclosion-piece"><span>${segmentIcon(piece.icon)}</span><h4>${esc(piece.title)}</h4><p>${esc(piece.body)}</p></div>`).join('')}</div><svg class="eclosion-question-links" viewBox="0 0 600 55" preserveAspectRatio="none" aria-hidden="true"><path d="M145 0v13q0 12 12 12h131q12 0 12 12v18m155-55v13q0 12-12 12H312q-12 0-12 12"/></svg><p class="eclosion-question"><span aria-hidden="true">?</span>${esc(t.question)}</p><figcaption>${esc(t.caption)}</figcaption></figure></aside>`;}

function organism(mode,id){const layouts={loose:[[30,30,-18],[230,25,15],[115,130,-8],[285,180,20],[20,260,8],[180,290,-15]],gather:[[90,40,-12],[210,60,12],[80,160,0],[215,170,0],[90,270,10],[220,275,-10]],cocoon:[[135,25,0],[135,85,0],[135,145,0],[135,205,0],[135,265,0],[135,325,0]],open:[[110,25,-8],[170,85,8],[90,145,-15],[185,205,15],[110,265,-12],[170,325,12]],wings:[[90,60,-28],[200,65,28],[45,160,-18],[250,160,18],[90,265,20],[210,265,-20]]};const colors=['#d7d3e9','#e9e6f3','#d1cde5','#e2deef','#fbe9e3','#dcd8ec'];const positions=layouts[mode];return `<svg class="organism ${mode}" viewBox="0 0 400 440" role="img" aria-labelledby="${id}-title ${id}-desc"><title id="${id}-title">${esc({loose:'Las seis partes disponibles',gather:'Las partes empiezan a acercarse',cocoon:'Una forma en construcción',open:'Las partes empiezan a desplegarse',wings:'Las mismas partes conectadas'}[mode])}</title><desc id="${id}-desc">Propósitos, contenidos, actividades, orientaciones, recursos y retroalimentación. ${mode==='wings'?'Se distribuyen a ambos lados de un eje y evocan alas.':'Su disposición acompaña este momento del recorrido.'}</desc>${mode==='wings'?'<path d="M145 95 L255 100 L305 195 L265 310 L145 310 L100 195 Z M145 95 L265 310 M255 100 L145 310" class="organism-links" fill="none" stroke="#7c74b5" stroke-width="2"/>':''}${positions.map(([x,y,a],i)=>`<g class="segment" data-component="${i}" transform="translate(${x} ${y}) rotate(${a} 55 35)"><path d="M8 8 C30 -6 89 -2 106 15 C126 33 107 63 87 69 C54 83 2 69 0 40 C-3 25 0 16 8 8Z" fill="${colors[i]}" stroke="#7c74b5" stroke-width="1.2"/><text x="54" y="39" text-anchor="middle" font-family="Roboto, sans-serif" font-size="10" fill="#132d48">${esc(C.components[i].name)}</text></g>`).join('')}</svg>`;}

/* Composición editorial del primer concepto; el contenido sigue siendo editable en JSON. */
function metaphorConcept(c){const t=c.layout;return `<p class="drawer-intro">Una metáfora puede ser algo más que una figura retórica.</p><p class="small">${esc(t.drawerHint)}</p><div class="metaphor-drawers">${t.drawers.map((drawer,i)=>`<details class="metaphor-drawer drawer-${i+1}"><summary><span class="drawer-label">${esc(drawer.title)}</span><span class="drawer-handle" aria-hidden="true"></span></summary><div class="drawer-content">${paras(drawer.paragraphs)}${drawer.examples?`<dl class="drawer-examples">${drawer.examples.map(e=>`<div>${associationBridge(e.pair)}<dt>«${esc(e.phrase)}»</dt><dd>${esc(e.relation)}</dd></div>`).join('')}</dl>`:''}</div></details>`).join('')}</div><section class="reflection-invitation" aria-label="Una pausa para pensar"><p>${esc(c.question)}</p><details><summary>Una nota para volver a tu asociación</summary>${noteBox('association-note',c.note,'Por ejemplo: el tiempo como río…')}</details></section><details class="reading-reference thinker-reading"><summary><span class="thinker-icon"><svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M25 31c-5-4-8-9-6-15 2-7 9-10 16-7 5 2 7 7 7 12l5 7-7 2-1 9-9-2M22 13l5-2m-8 9 5-3m11 7h2M22 57l2-11 9-5 6 9M9 57l5-17 9-7 6 7M24 46l11-14 5 2-7 15M20 57h26M31 37l-4-4"/><circle cx="49" cy="12" r="2" fill="currentColor" stroke="none"/><circle cx="55" cy="7" r="1.5" fill="currentColor" stroke="none"/></svg></span><span class="thinker-label"><strong>${esc(c.reading.title)}</strong><span>${esc(c.reading.hint)}</span></span><span class="thinker-toggle" aria-hidden="true"></span></summary><div class="thinker-reading-body">${paras(c.reading.paragraphs)}<section class="aristotle-example" aria-labelledby="aristotle-example-title"><h4 id="aristotle-example-title">${esc(c.reading.example.title)}</h4><p>${bibliographyMention(c.reading.example.intro)}</p><ul class="aristotle-analogy">${c.reading.example.pairs.map(pair=>`<li><strong>${esc(pair[0])}</strong><span aria-hidden="true">→</span><strong>${esc(pair[1])}</strong></li>`).join('')}</ul><p>${esc(c.reading.example.explanation)}</p><p>${esc(c.reading.example.reflection)}</p><p class="small">${bibliographyMention(c.reading.example.source)}</p></section></div></details>`;}

function conceptOrganism(mode){let svg=organism(mode,'concept-form');if(mode==='gather'){svg=svg.replace('<g class="segment"',`<path d="M145 75 Q205 20 265 95 M145 75 Q80 135 135 195 M265 95 Q320 150 270 205 M135 195 Q200 155 270 205 M135 195 Q75 250 145 305 M270 205 Q325 270 275 310 M145 305 Q210 365 275 310" fill="none" stroke="currentColor" stroke-width="2" opacity=".45" aria-hidden="true"/><g class="segment"`);}return svg;}
/* La onda representa la amplitud del archivo final; los controles nativos quedan como respaldo. */

function initAudioPlayers(){
 document.querySelectorAll('.wave-player:not([data-player-ready])').forEach(root=>{
 root.dataset.playerReady='true';
 const audio=root.querySelector('audio'),ui=root.querySelector('.wave-player-ui'),toggle=root.querySelector('.wave-toggle'),seek=root.querySelector('.wave-position'),volume=root.querySelector('.wave-volume input'),time=root.querySelector('.wave-time'),progress=root.querySelector('clipPath rect'),status=root.querySelector('[role="status"]'),t={...C.playerLabels,duration:Number(root.dataset.duration),play:C.playerLabels.play+' · '+root.dataset.audioLabel,pause:C.playerLabels.pause+' · '+root.dataset.audioLabel};
 const format=value=>{const seconds=Math.max(0,Math.floor(value||0));return Math.floor(seconds/60)+':'+String(seconds%60).padStart(2,'0');};
 function update(){const duration=Number.isFinite(audio.duration)&&audio.duration>0?audio.duration:t.duration;seek.value=String(Math.round(audio.currentTime/duration*1000));seek.setAttribute('aria-valuetext',format(audio.currentTime)+' de '+format(duration));progress.setAttribute('width',String(Math.min(750,audio.currentTime/duration*750)));time.textContent=format(audio.currentTime)+' / '+format(duration);toggle.setAttribute('aria-label',audio.paused?t.play:t.pause);toggle.querySelector('span').textContent=audio.paused?'▶︎':'Ⅱ';}
 function fallback(){audio.controls=true;ui.hidden=true;status.textContent=t.error;}
 toggle.addEventListener('click',async()=>{try{if(audio.paused){await audio.play();status.textContent='';}else audio.pause();}catch(error){if(error.name!=='AbortError')fallback();}});

 volume.addEventListener('input',()=>{audio.volume=Number(volume.value);});
 audio.addEventListener('volumechange',()=>{volume.value=String(audio.volume);});
 for(const name of ['play','pause','ended','timeupdate','durationchange'])audio.addEventListener(name,update);
 audio.addEventListener('error',fallback);update();audio.controls=false;ui.hidden=false;
 });
}

function componentMosaic(){return `<dl class="component-mosaic" aria-label="${esc(C.segmentVisuals.componentLabel)}">${C.components.map((part,i)=>`<div><dt>${segmentIcon(i)}${esc(part.name)}</dt><dd>${esc(part.meaning)}</dd></div>`).join('')}</dl>`;}
function associationBridge(pair){return pair?`<div class="association-bridge"><span>${esc(pair[0])}</span><svg viewBox="0 0 60 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 17Q30-10 55 17m-8-1 8 1-2-8"/></svg><span>${esc(pair[1])}</span></div>`:'';}
function comparisonRoute(path){const t=C.learningPaths[path];return `<p class="path-hint">${esc(t.hint)}</p><ul class="learning-path">${t.steps.map(step=>`<li><span class="learning-action-icon">${learningIcon(step.icon)}</span><strong>${esc(step.title)}</strong><p>${esc(step.body)}</p></li>`).join('')}</ul><p class="path-return">${esc(t.footer)}</p>`;}
function proposalFork(){const t=C.segmentVisuals;return `<figure class="proposal-fork"><h3 class="design-bridge-title">${esc(C.designBridge.title)}</h3><p class="design-bridge-intro">${esc(C.designBridge.intro)}</p><ul class="design-bridge-relations">${C.designBridge.relations.map(relation=>`<li><span class="design-bridge-part">${segmentIcon(relation.icons[0])}<strong>${esc(relation.from)}</strong></span><span class="design-bridge-link">${esc(relation.link)}<span aria-hidden="true">→</span></span><span class="design-bridge-part">${segmentIcon(relation.icons[1])}<strong>${esc(relation.to)}</strong></span></li>`).join('')}</ul><p class="design-bridge-hint">${esc(C.designBridge.hint)}</p><p class="fork-root">${esc(t.forkRoot)}</p><svg class="fork-links" viewBox="0 0 300 45" preserveAspectRatio="none" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M150 0v15Q150 22 140 22H20q-10 0-10 10v13M150 15q0 7 10 7h120q10 0 10 10v13"/></svg><ul class="fork-options">${t.forkOptions.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><figcaption>${esc(t.forkCaption)}</figcaption></figure>`;}
/* Esquema del OA: los rótulos de las conexiones explican el vínculo. */
function oaRelationshipScheme(){const t=C.oaScheme;return `<figure class="oa-relationship" aria-labelledby="oa-relationship-title"><h3 id="oa-relationship-title">${esc(t.title)}</h3><div class="oa-purpose">${segmentIcon(0)}<h4>${esc(t.purpose)}</h4><p>${esc(t.purposeBody)}</p></div><p class="oa-link">${esc(t.firstLink)}<span aria-hidden="true">↓</span></p><div class="oa-activity">${segmentIcon(2)}<h4>${esc(t.activity)}</h4><p>${esc(t.activityBody)}</p><ul class="oa-supports">${t.supports.map(x=>`<li><strong>${esc(x.title)}</strong><span>${esc(x.body)}</span></li>`).join('')}</ul></div><p class="oa-link">${esc(t.secondLink)}<span aria-hidden="true">↓</span></p><div class="oa-feedback">${segmentIcon(5)}<h4>${esc(t.feedback)}</h4><p>${esc(t.feedbackBody)}</p></div><figcaption>${esc(t.caption)}</figcaption></figure>`;}

<section class="chapter" id="larva" aria-labelledby="larva-title"><div class="larva-parts-scene"><p class="eyebrow">01 · Larva</p><h2 id="larva-title">${esc(C.larva.title)}</h2><p class="lead">${esc(C.larva.intro)}</p><p class="larva-parts-intro">${esc(C.larva.parts)}</p><div class="component-definitions ink-first-composition">${stageArtwork('larva',{definitions:true})}</div><p class="larva-connection-question">${esc(C.larva.question)}</p></div><div class="larva-relations-scene">${oaRelationshipScheme()}<p class="larva-metaphor-bridge">${esc(C.larva.bridge)}</p></div></section>

/* Los mismos cuatro materiales reaparecen en distintas disposiciones. */
function curationMaterialGraphic(index){const labels=C.curationScheme.graphicMaterials;if(index===2){return `<svg class="curation-material-graphic" viewBox="0 0 222 145" aria-hidden="true"><text x="111" y="13" text-anchor="middle" font-family="Roboto, sans-serif" font-size="10" fill="#132d48">Escucha</text><text x="111" y="88" text-anchor="middle" font-family="Roboto, sans-serif" font-size="10" fill="#132d48">Exploración</text><path d="M25 40h172M25 115h172" stroke="#7c74b5" stroke-width="2"/>${[24,99].map(y=>labels.map((label,i)=>`<g><rect x="${3+i*55}" y="${y}" width="50" height="32" rx="8" fill="${['#ffe0cf','#f3f4fb','#d5c6ec','#eee8f6'][i]}" stroke="#5b538e"/><text x="${28+i*55}" y="${y+20}" text-anchor="middle" font-family="Roboto, sans-serif" font-size="8" fill="#132d48">${esc(label)}</text></g>`).join('')).join('')}</svg>`;}const positions=index===0?[[8,15],[118,15],[8,70],[118,70]]:index===1?[[8,10],[118,10],[8,85],[118,85]]:[[4,20],[116,20],[4,94],[116,94]];const cards=positions.map(([x,y],i)=>`<g><rect x="${x}" y="${y}" width="96" height="38" rx="10" fill="${['#ffe0cf','#f3f4fb','#d5c6ec','#eee8f6'][i]}" stroke="#5b538e"/><text x="${x+48}" y="${y+23}" text-anchor="middle" font-family="Roboto, sans-serif" font-size="11" fill="#132d48">${esc(labels[i])}</text></g>`).join('');let links='';if(index===1)links='<path d="M56 29 166 104M166 29 56 104M56 29v75m110-75v75" stroke="#7c74b5" stroke-width="2" fill="none"/>';if(index===2)links='<path d="M52 39h112M52 113h112m-55-62 7-12-7-12m0 98 7-12-7-12" stroke="#5b538e" stroke-width="2" fill="none"/>';return `<svg class="curation-material-graphic" viewBox="0 0 222 145" aria-hidden="true">${links}${cards}${index===2?'<text x="111" y="10" text-anchor="middle" font-family="Roboto, sans-serif" font-size="10" fill="#132d48">Escucha</text><text x="111" y="85" text-anchor="middle" font-family="Roboto, sans-serif" font-size="10" fill="#132d48">Exploración</text>':''}</svg>`;}
function curationScheme(){const t=C.curationScheme;return `<figure class="curation-scheme" aria-labelledby="curation-scheme-title"><h4 id="curation-scheme-title">${esc(t.title)}</h4><div class="curation-purpose"><strong>${esc(t.purposeTitle)}</strong><p>${esc(t.purposeBody)}</p></div><div class="curation-materials"><p>${esc(t.materialsLabel)}</p><ul class="material-tokens">${t.materials.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><ul class="curation-diagram">${t.steps.map((step,i)=>`<li data-curation-step="${i}"><h5>${esc(step.title)}</h5>${curationMaterialGraphic(i)}<p class="curation-transformation-label">${esc(t.transformationLabels[i])}</p><p class="scheme-question">${esc(step.question)}</p><p>${esc(step.body)}</p><p>${esc(step.detail)}</p></li>`).join('')}</ul><p class="curation-outcome">${esc(t.result)}</p><figcaption>${esc(t.caption)}</figcaption></figure>`;}

function pairBoard(){const t=C.pairBoard;return `<section class="pair-board" id="mesa-conexiones" aria-label="Vincular una voz y una evidencia"><div class="pair-selectors"><div><h4>${learningIcon(0)}${esc(t.voiceTitle)}</h4><div class="pair-options" role="group" aria-label="${esc(t.voiceTitle)}">${C.voices.map(v=>`<button type="button" data-pair-voice="${esc(v.id)}" aria-pressed="false" aria-controls="pair-voice-card">${esc(v.name)}</button>`).join('')}</div></div><div><h4>${learningIcon(1)}${esc(t.evidenceTitle)}</h4><div class="pair-options" role="group" aria-label="${esc(t.evidenceTitle)}">${C.evidence.filter(e=>e.id!=='guia').map(e=>`<button type="button" data-pair-evidence="${esc(e.id)}" aria-pressed="false" aria-controls="pair-evidence-card">${esc(e.title)}</button>`).join('')}</div></div></div><div class="pair-composition"><article id="pair-voice-card" class="pair-source-card pair-voice-card"></article><div class="pair-link"><svg viewBox="0 0 160 56" preserveAspectRatio="none" aria-hidden="true"><path d="M0 28C30 0 50 56 80 28s50-28 80 0"/></svg><strong>${esc(t.linkLabel)}</strong></div><article id="pair-evidence-card" class="pair-source-card pair-evidence-card"></article></div><p class="pair-link-hint">${esc(t.linkHint)}</p><p class="pair-status" id="pair-status" role="status"></p></section>`;}
function updatePairBoard(){
 const board=document.querySelector('.pair-board');if(!board)return;
 const t=C.pairBoard,v=C.voices.find(x=>x.id===state.podcast.compareVoice),e=C.evidence.find(x=>x.id===state.podcast.compareEvidence&&x.id!=='guia');
 const voiceCard=document.getElementById('pair-voice-card'),evidenceCard=document.getElementById('pair-evidence-card');
 voiceCard.innerHTML=v?`<p class="pair-source-type">${esc(t.voiceLabel)}</p><h4>${esc(v.name)}</h4><blockquote>«${esc(v.text)}»</blockquote><a href="#sound-voice-title-${C.voices.indexOf(v)}">${esc(t.listenAgain)}</a>`:`<span class="pair-empty-icon">${learningIcon(0)}</span><p>${esc(t.voiceEmpty)}</p>`;
 evidenceCard.innerHTML=e?`<p class="pair-source-type">${esc(t.evidenceLabel)}</p><h4>${esc(e.title)}</h4><p>${esc(e.body)}</p>`:`<span class="pair-empty-icon">${learningIcon(1)}</span><p>${esc(t.evidenceEmpty)}</p>`;
 board.querySelectorAll('[data-pair-voice]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.pairVoice===v?.id)));
 board.querySelectorAll('[data-pair-evidence]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.pairEvidence===e?.id)));
 board.classList.toggle('has-pair',Boolean(v&&e));
 document.getElementById('pair-status').textContent=v&&e?v.name+' y '+e.title+': ahora podés explorar qué relación encontrás entre estas piezas.':t.initialStatus;
}
document.addEventListener('click',event=>{const voice=event.target.closest('[data-pair-voice]'),evidence=event.target.closest('[data-pair-evidence]');if(voice||evidence){if(voice)state.podcast.compareVoice=voice.dataset.pairVoice;if(evidence)state.podcast.compareEvidence=evidence.dataset.pairEvidence;updatePairBoard();scheduleSave();}});

function reflection(path){return `<div class="workspace reflection"><h3>${esc(C.reflection.title)}</h3><p>${esc(C.reflection.intro)}</p><section class="reading-block first-reading"><h4>Tu primera interpretación</h4><p class="first-interpretation" id="first-interpretation"></p></section>${hintMarkup()}<label for="explanation">${esc(C.reflection.label)}</label><textarea id="explanation" placeholder="${esc(C.reflection.placeholder)}" aria-describedby="privacy">${esc(state[path].explanation)}</textarea><p class="small" id="privacy">${esc(C.reflection.privacy)}</p><button id="copy" class="secondary">${esc(C.ui.copy)}</button><p class="small status" id="copy-status" role="status"></p><p>${esc(C.reflection.compareHelp)}</p><button id="reveal" aria-expanded="${state[path].revealed}" aria-controls="reconstruction">${esc(state[path].revealed?C.reflection.hide:C.reflection.reveal)}</button><section id="reconstruction" class="reconstruction" ${state[path].revealed?'':'hidden'}><h3>${esc(C.reflection.answerTitle)}</h3><p>${esc(C.reflection.answer)}</p><p class="small">${esc(C.reflection.caution)}</p><p>${esc(C.assistance.review)}</p></section></div>`;}
function renderPath(path){const s=state[path],p=C[path];document.getElementById('investigation-title').textContent=p.title;document.getElementById('path-status').textContent=C.choose.paths.find(x=>x.id===path).label;let body='';
if(path==='podcast')body=`<p class="note">${esc(p.audioNotice)}</p>${soundMap()}<div class="workspace"><h3>${esc(p.evidenceTitle)}</h3><p>${esc(p.evidenceIntro)}</p>${evidenceList(false)}</div><div class="workspace"><h3>${esc(p.contrastTitle)}</h3><p>${esc(p.contrastIntro)}</p>${pairBoard()}<details><summary>Si te sirve, anotá una relación</summary><label for="contrast-note">${esc(p.contrastLabel)}</label><textarea id="contrast-note" placeholder="${esc(p.contrastPlaceholder)}">${esc(s.note)}</textarea><p class="small">${esc(C.reflection.privacy)}</p></details></div><div class="workspace"><h3>${esc(p.architectureTitle)}</h3><p>${esc(p.architectureIntro)}</p><div class="details-grid">${visibleTexts(p.nodes)}</div></div>`;
else body=`<div class="workspace"><h3>${esc(p.exploreTitle)}</h3><p>${esc(p.exploreIntro)}</p>${evidenceList(true)}</div><div class="workspace"><h3>${esc(p.relationsTitle)}</h3><p>${esc(p.relationsIntro)}</p><details><summary>Si te sirve, anotá la relación entre dos piezas</summary><label for="relation-note">Tu relación entre dos piezas — nota opcional</label><textarea id="relation-note" placeholder="${esc(C.ui.relationPlaceholder)}">${esc(s.relationNote||'')}</textarea><p class="small">${esc(C.reflection.privacy)}</p></details><div class="details-grid">${details(p.relations.map(r=>({title:r.title+' · Lectura posible',body:r.body})))}</div></div><div class="workspace evidence-organizer" id="ordenar-indicios"><h3>${esc(p.organizeTitle)}</h3><p>${esc(p.organizeIntro)}</p><div class="zones">${p.zones.map((z,i)=>`<div class="zone"><h3>${esc(z)}</h3><div role="group" aria-label="${esc(z)}">${p.pieces.map((piece,j)=>`<button data-zone="${i}" data-piece="${j}" aria-pressed="${s.zones[i].has(j)}"><span class="zone-check" aria-hidden="true">✓</span>${esc(piece)}</button>`).join('')}</div></div>`).join('')}</div></div>`;
document.getElementById('investigation-content').innerHTML=`<div class="path-head"><p class="lead">${esc(p.intro)}</p><button id="switch-path" class="secondary">${esc(C.ui.switch)}</button></div>${body}${reflection(path)}<p class="note">${esc(p.closing)}</p><div class="workspace"><a class="button-link" href="#reencuentro">${esc(C.branchEnd.button)}</a></div>`;
initAudioPlayers();updatePairBoard();
document.getElementById('first-interpretation').textContent=personalNotes['case-first-note']||'No dejaste una nota. Podés recordar lo que pensabas al conocer el caso y compararlo con lo que encontraste.';const active=s.active;if(active)showEvidence(active);else updateEvidenceButtons();
document.getElementById('explanation').addEventListener('input',e=>s.explanation=e.target.value);
const relationNote=document.getElementById('relation-note');if(relationNote)relationNote.addEventListener('input',e=>s.relationNote=e.target.value);const note=document.getElementById('contrast-note');if(note)note.addEventListener('input',e=>s.note=e.target.value);
document.getElementById('switch-path').onclick=()=>{document.getElementById('elegir').scrollIntoView();document.querySelector(`[data-path="${path==='podcast'?'artefacto':'podcast'}"]`).focus({preventScroll:true});};
document.getElementById('reveal').onclick=e=>{s.revealed=!s.revealed;e.currentTarget.setAttribute('aria-expanded',s.revealed);e.currentTarget.textContent=s.revealed?C.reflection.hide:C.reflection.reveal;document.getElementById('reconstruction').hidden=!s.revealed;};
document.getElementById('copy').onclick=async()=>{const status=document.getElementById('copy-status');if(!s.explanation.trim()){status.textContent=C.ui.empty;return;}try{await navigator.clipboard.writeText(s.explanation);status.textContent=C.ui.copied;}catch{status.textContent=C.ui.copyFailure;document.getElementById('explanation').focus();document.getElementById('explanation').select();}};
}
function updateEvidenceButtons(){const s=state[state.path];document.querySelectorAll('[data-evidence]').forEach(b=>{const id=b.dataset.evidence;const e=id==='voz'?{title:C.ui.voicePiece}:C.evidence.find(x=>x.id===id);b.textContent=e.title+(s.visited.has(id)?' · '+C.ui.consulted:'');b.setAttribute('aria-pressed',id===s.active);});}
function showEvidence(id){const s=state[state.path];s.active=id;s.visited.add(id);let html;if(id==='voz'){html=voice(C.voices[0]);}else{const e=C.evidence.find(x=>x.id===id);html=`<h3>${esc(e.title)}</h3><p>${esc(e.body)}</p>${id==='ubicacion'?'<div class="map"><div>Sección anterior · Guía de criterios</div><p class="back">↑ Volver atrás para consultarla</p><div class="activity">Actividad · Sin acceso directo a la guía</div></div>':''}<p class="quote">${esc(e.question)}</p><p class="small">${esc(e.source)}</p>`;}
// Pausar un audio antes de reemplazarlo o cambiar de recorrido.
document.querySelectorAll('#evidence-body audio').forEach(a=>a.pause());document.getElementById('evidence-body').innerHTML=html;initAudioPlayers();updateEvidenceButtons();}
document.addEventListener('click',e=>{const choose=e.target.closest('[data-path]');if(choose){document.querySelectorAll('#investigation-content audio').forEach(a=>a.pause());state.path=choose.dataset.path;renderPath(state.path);document.querySelectorAll('[data-path]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.path===state.path));document.querySelectorAll('[data-card]').forEach(b=>b.dataset.selected=b.dataset.card===state.path);const h=document.getElementById('investigation-title');h.tabIndex=-1;h.focus({preventScroll:true});document.getElementById('investigar').scrollIntoView();return;}const evidence=e.target.closest('[data-evidence]');if(evidence){showEvidence(evidence.dataset.evidence);return;}const zone=e.target.closest('[data-zone]');if(zone){const s=state.artefacto.zones[Number(zone.dataset.zone)],piece=Number(zone.dataset.piece);s.has(piece)?s.delete(piece):s.add(piece);zone.setAttribute('aria-pressed',s.has(piece));}});
/* Movimiento: preferencia del sistema más control explícito de la persona. */
const media=matchMedia('(prefers-reduced-motion: reduce)'),motion=document.getElementById('motion');let userReduced=false;
function applyMotion(){const reduced=media.matches||userReduced;document.body.classList.toggle('no-motion',reduced);motion.setAttribute('aria-pressed',reduced);motion.setAttribute('aria-disabled',media.matches);motion.textContent=reduced?C.ui.motionOff:C.ui.motionOn;if(reduced)document.querySelectorAll('[data-curation-step]').forEach(card=>card.classList.remove('is-in-view'));refreshInkMotion();}
motion.onclick=()=>{if(media.matches)return;userReduced=!userReduced;applyMotion();};media.addEventListener('change',applyMotion);applyMotion();
/* El scroll cambia solo el SVG; nunca decide una rama ni revela una respuesta. */
if('IntersectionObserver' in window){const observer=new IntersectionObserver(entries=>{for(const entry of entries)if(entry.isIntersecting)document.getElementById('case-visual').classList.toggle('connected',false);},{rootMargin:'-20% 0px -35% 0px',threshold:0});document.querySelectorAll('[data-stage]').forEach(el=>observer.observe(el));}
// La voz que suena se destaca dentro del mapa; el audio sigue bajo control de la persona.
document.addEventListener('play',event=>{const active=event.target.closest('.sound-voice');document.querySelectorAll('.sound-voice').forEach(card=>card.classList.toggle('is-speaking',card===active));},true);
document.addEventListener('pause',event=>{event.target.closest('.sound-voice')?.classList.remove('is-speaking');},true);
document.addEventListener('ended',event=>{event.target.closest('.sound-voice')?.classList.remove('is-speaking');},true);
// En movimiento reducido, los tres momentos mantienen el mismo peso visual.
if('IntersectionObserver' in window){const highlights=new IntersectionObserver(entries=>{for(const entry of entries)entry.target.classList.toggle('is-in-view',entry.isIntersecting&&!media.matches&&!userReduced);},{rootMargin:'-15% 0px -20% 0px',threshold:.45});document.querySelectorAll('[data-curation-step]').forEach(card=>highlights.observe(card));}
// Evitar dos testimonios reproduciéndose al mismo tiempo.
document.addEventListener('play',e=>{if(e.target.tagName==='AUDIO')document.querySelectorAll('audio').forEach(a=>{if(a!==e.target)a.pause();});},true);

/* Comparación, transferencia y conservación de las notas. */
const personalNotes={},transferState={choice:null,metafora:[],otra:[]};

function decisionText(){const c=C.transfer.choices.find(c=>c.id===transferState.choice);return [C.transfer.needLabel+'\n'+(personalNotes['need-note']||''),C.transfer.organizeLabel+'\n'+(personalNotes['organize-note']||''),c?c.title:'Decisión todavía abierta',...(c?c.fields.map((f,i)=>f+'\n'+(transferState[c.id][i]||'')):[])].join('\n\n');}
/* Solo exportamos producciones con contenido; se conservan notas de versiones anteriores. */
function notesText(){
 const sections=[];
 const add=(label,value)=>{if(typeof value==='string'&&value.trim())sections.push(label+'\n'+value.trim());};
 add(C.larva.label,personalNotes['larva-note']);
 add(C.concepts[0].note,personalNotes['association-note']);
 add('Nota de una versión anterior del recorrido',personalNotes['self-note']);
 add('Mi primera interpretación del caso',personalNotes['case-first-note']);
 for(const path of ['podcast','artefacto']){
  const s=state[path],entries=[];
  const item=(label,value)=>{if(typeof value==='string'&&value.trim())entries.push(label+'\n'+value.trim());};
  if(path==='podcast'){
   const voice=C.voices.find(v=>v.id===s.compareVoice),evidence=C.evidence.find(e=>e.id===s.compareEvidence&&e.id!=='guia');
   item('Voz elegida para relacionar',voice?voice.name+'\n'+voice.text:'');
   item('Evidencia elegida para relacionar',evidence?evidence.title+'\n'+evidence.body:'');
  }
  item(path==='podcast'?C.podcast.contrastLabel:'Mi relación entre dos piezas',path==='podcast'?s.note:s.relationNote);
  item(C.reflection.label,s.explanation);
  item('Reflexión guardada en una versión anterior',s.meta);
  if(path==='artefacto')s.zones.forEach((pieces,i)=>{if(pieces.size)entries.push(C.artefacto.zones[i]+'\n'+[...pieces].map(j=>'• '+C.artefacto.pieces[j]).join('\n'));});
  if(entries.length)sections.push((path==='podcast'?'Camino Podcast':'Camino Artefacto interactivo')+'\n\n'+entries.join('\n\n'));
 }
 add(C.transfer.needLabel,personalNotes['need-note']);
 add(C.transfer.organizeLabel,personalNotes['organize-note']);
 for(const choice of C.transfer.choices)choice.fields.forEach((label,i)=>add(label,transferState[choice.id][i]));
 return sections.length?['El poder de la metáfora · Mis notas',...sections].join('\n\n'):'';
}
document.addEventListener('input',e=>{if(e.target.classList.contains('personal-note'))personalNotes[e.target.id]=e.target.value;});
document.addEventListener('click',e=>{const connection=e.target.closest('[data-connection]');if(connection){const i=Number(connection.dataset.connection),c=C.butterfly.connections[i];document.getElementById('connection-description').innerHTML=`<h3>${esc(c.title)}</h3><p>${esc(c.body)}</p>`;document.querySelectorAll('[data-connection]').forEach(b=>b.setAttribute('aria-pressed',Number(b.dataset.connection)===i));document.querySelectorAll('#butterfly-visual .segment').forEach(g=>{const selected=c.pair.includes(Number(g.dataset.component));g.classList.toggle('dim',!selected);g.classList.toggle('is-highlighted',selected);});}
});
function downloadNotes(){
 const text=notesText(),status=document.getElementById('notes-status');
 if(!text){status.textContent=C.assistance.emptyNotes;status.scrollIntoView({block:'nearest'});return;}
 const blob=new Blob([text],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='mis-notas-metafora.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);
 status.textContent='La descarga de tus notas está preparada. Guardá el archivo para conservar tu copia.';
}
document.getElementById('download-notes').onclick=downloadNotes;
if('IntersectionObserver' in window){const concepts=new IntersectionObserver(entries=>{const visible=entries.filter(e=>e.isIntersecting);if(!visible.length)return;const i=Number(visible[visible.length-1].target.dataset.concept);document.querySelector('#concept-visual').dataset.concept=String(i);document.getElementById('concept-caption').textContent='Crisálida · '+C.concepts[i].title;},{rootMargin:'-15% 0px -40% 0px'});document.querySelectorAll('.concept-step').forEach(e=>concepts.observe(e));const phases=new IntersectionObserver(entries=>{for(const entry of entries)if(entry.isIntersecting){let phase=entry.target.id;if(phase==='tu-objeto'||phase==='cierre')phase='mariposa';if(phase==='reencuentro'||phase==='elegir'||phase==='investigar')phase='caso';document.querySelectorAll('.phase a').forEach(a=>{if(a.getAttribute('href')==='#'+phase)a.setAttribute('aria-current','location');else a.removeAttribute('aria-current');});}},{rootMargin:'-10% 0px -65% 0px'});document.querySelectorAll('#larva,#crisalida,#caso,#elegir,#investigar,#reencuentro,#mariposa,#tu-objeto,#cierre').forEach(e=>phases.observe(e));}


/* Guardado local con recuperación, degradación y borrado explícito. */
const STORAGE_KEY='metafora-v1-autoasistida-v1';
const checkpointNames={larva:'Larva',crisalida:'Crisálida',caso:'El caso',elegir:'La elección de camino',investigar:'La investigación',reencuentro:'El reencuentro',mariposa:'Mariposa','tu-objeto':'Tu objeto',cierre:'El cierre'};
let checkpoint='larva',saveTimer=null,restoring=false,storageBlocked=false,corruptCopy=null;
const statusElement=document.getElementById('storage-status');
function stringValue(v){return typeof v==='string'?v:'';}
function validNotes(v){return v&&typeof v==='object'&&!Array.isArray(v);}
function snapshot(){return {version:1,savedAt:new Date().toISOString(),checkpoint,motion:userReduced,notes:personalNotes,transfer:transferState,branches:{path:state.path,podcast:{...state.podcast,visited:[...state.podcast.visited]},artefacto:{...state.artefacto,visited:[...state.artefacto.visited],zones:state.artefacto.zones.map(x=>[...x])}}};}
function checkpointLabel(){return checkpointNames[checkpoint]||checkpointNames.larva;}
function writeSave(){if(restoring||corruptCopy!==null)return;try{localStorage.setItem(STORAGE_KEY,JSON.stringify(snapshot()));storageBlocked=false;statusElement.textContent=C.assistance.saved;document.getElementById('resume-description').textContent='Punto de retorno: '+checkpointLabel()+'. Esto no indica que hayas completado el tramo.';}catch{storageBlocked=true;statusElement.textContent=C.assistance.unavailable;}}
function scheduleSave(){if(restoring||corruptCopy!==null)return;clearTimeout(saveTimer);if(!storageBlocked)statusElement.textContent=C.assistance.pending;saveTimer=setTimeout(writeSave,300);}
function selectPathWithoutJump(path){state.path=path;renderPath(path);document.querySelectorAll('[data-path]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.path===path));document.querySelectorAll('[data-card]').forEach(b=>b.dataset.selected=b.dataset.card===path);}
function readSave(){let raw=null;try{raw=localStorage.getItem(STORAGE_KEY);}catch{storageBlocked=true;statusElement.textContent=C.assistance.unavailable;return;}if(!raw){writeSave();return;}try{const data=JSON.parse(raw);if(data.version!==1||!validNotes(data.notes)||!validNotes(data.branches)||!validNotes(data.transfer))throw Error('Formato de guardado incompatible');restoring=true;
for(const [id,value] of Object.entries(data.notes)){if(typeof value==='string'){personalNotes[id]=value;const el=document.getElementById(id);if(el?.classList.contains('personal-note'))el.value=value;}}
for(const path of ['podcast','artefacto']){const saved=data.branches[path];if(!validNotes(saved)||!Array.isArray(saved.visited))throw Error('Camino incompatible');const target=state[path];for(const key of ['note','explanation','meta','relationNote','compareVoice','compareEvidence'])target[key]=stringValue(saved[key]);target.revealed=saved.revealed===true;target.visited=new Set(saved.visited.filter(x=>['voz','consigna','ubicacion','registro','guia'].includes(x)));target.active=target.visited.has(saved.active)?saved.active:null;if(path==='artefacto'){if(!Array.isArray(saved.zones)||saved.zones.length!==3)throw Error('Zonas incompatibles');target.zones=saved.zones.map(xs=>{if(!Array.isArray(xs))throw Error('Zona incompatible');return new Set(xs.filter(x=>Number.isInteger(x)&&x>=0&&x<C.artefacto.pieces.length));});}}
for(const choice of ['metafora','otra'])transferState[choice]=Array.isArray(data.transfer[choice])?data.transfer[choice].map(stringValue):[];
if(['metafora','otra'].includes(data.transfer.choice))transferState.choice=data.transfer.choice;
if(['podcast','artefacto'].includes(data.branches.path))selectPathWithoutJump(data.branches.path);
checkpoint=Object.hasOwn(checkpointNames,data.checkpoint)?data.checkpoint:'larva';userReduced=data.motion===true;applyMotion();
statusElement.textContent=C.assistance.restored;document.getElementById('resume-description').textContent='Último punto de retorno: '+checkpointLabel()+'. Tus notas están disponibles aunque prefieras volver al inicio.';document.getElementById('resume-work').hidden=false;
}catch{corruptCopy=raw;statusElement.textContent=C.assistance.invalid;document.getElementById('download-raw').hidden=false;}finally{if(restoring&&document.activeElement instanceof HTMLElement)document.activeElement.blur();restoring=false;}}
readSave();
// Un enlace al mapa sonoro puede abrir explícitamente el camino podcast.
const entryPath=new URLSearchParams(location.search).get('camino');
if(['podcast','artefacto'].includes(entryPath))selectPathWithoutJump(entryPath);
if(location.hash){const destination=document.getElementById(decodeURIComponent(location.hash.slice(1)));if(destination)requestAnimationFrame(()=>destination.scrollIntoView({block:'start',behavior:'instant'}));}
// Los controladores originales actualizan sus estados antes de este guardado.
document.addEventListener('input',()=>{scheduleSave();});
document.addEventListener('click',e=>{if(restoring)return;if(e.target.closest('[data-path]')){checkpoint='investigar';userNavigated=true;}if(e.target.closest('[data-transfer]')){checkpoint='tu-objeto';userNavigated=true;}if(e.target.closest('[data-path],[data-zone],[data-evidence],[data-transfer],[data-connection],#reveal,#motion'))scheduleSave();});
document.addEventListener('input',e=>{if(e.target.id==='case-first-note'){const view=document.getElementById('first-interpretation');if(view)view.textContent=e.target.value||'Podés recordar lo que pensabas al conocer el caso.';}});
// Recuperar los grafismos desde la copia versionada si falla el recurso de Pages.
const inkBackupBase='https://raw.githubusercontent.com/pedflacso/elpoderdelametafora/cd1f9cb/version-1-autoasistida/';
function recoverInkImage(img){
 if(!(img instanceof HTMLImageElement)||img.dataset.inkFallback)return;
 const src=img.getAttribute('src')||'',match=src.match(/(?:^|\/)imagenes\/grafismos\/([^/?#]+\.webp)(?:[?#].*)?$/);
 if(!match)return;
 img.dataset.inkFallback='true';
 const backup=inkBackupBase+'imagenes/grafismos/'+match[1];
 img.src=backup;
 if(img.classList.contains('eclosion-art'))document.querySelectorAll('.eclosion-wing-color').forEach(wing=>wing.style.setProperty('--eclosion-mask',`url("${backup}")`));
}
document.addEventListener('error',event=>recoverInkImage(event.target),true);
document.querySelectorAll('img').forEach(img=>{if(img.complete&&!img.naturalWidth)recoverInkImage(img);});
document.addEventListener('load',event=>{if(event.target instanceof HTMLImageElement&&event.target.matches('.ink-current,.ink-previous'))scheduleInkMotion();},true);
window.addEventListener('scroll',scheduleInkMotion,{passive:true});
window.addEventListener('resize',scheduleInkMotion);
requestAnimationFrame(refreshInkMotion);
window.addEventListener('pagehide',()=>{clearTimeout(saveTimer);writeSave();});
document.getElementById('save-work').onclick=()=>{clearTimeout(saveTimer);writeSave();};
document.getElementById('download-top').onclick=downloadNotes;
document.getElementById('resume-work').onclick=()=>{const section=document.getElementById(checkpoint);if(!section)return;section.scrollIntoView({block:'start'});const heading=section.querySelector('h2');if(heading){heading.tabIndex=-1;heading.focus({preventScroll:true});}};
document.getElementById('request-delete').onclick=()=>{document.getElementById('delete-confirmation').hidden=false;document.getElementById('cancel-delete').focus();};
document.getElementById('cancel-delete').onclick=()=>{document.getElementById('delete-confirmation').hidden=true;document.getElementById('request-delete').focus();};
document.getElementById('confirm-delete').onclick=()=>{try{localStorage.removeItem(STORAGE_KEY);clearTimeout(saveTimer);restoring=true;location.reload();}catch{statusElement.textContent='No se pudo borrar la copia local. Podés revisar los permisos del navegador.';}};
document.getElementById('download-raw').onclick=()=>{if(corruptCopy===null)return;const url=URL.createObjectURL(new Blob([corruptCopy],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='metafora-copia-local-para-recuperar.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);};
// No se confunde visitar una sección con completar una actividad.
let userNavigated=false;for(const eventName of ['wheel','touchstart','keydown'])window.addEventListener(eventName,()=>userNavigated=true,{passive:true});
document.addEventListener('click',e=>{const link=e.target.closest('a[href^="#"]');if(!link)return;const id=link.getAttribute('href').slice(1);if(Object.hasOwn(checkpointNames,id)){checkpoint=id;userNavigated=true;scheduleSave();}});
if('IntersectionObserver' in window){const checkpoints=new IntersectionObserver(entries=>{if(!userNavigated||restoring)return;for(const entry of entries)if(entry.isIntersecting){checkpoint=entry.target.id;scheduleSave();}},{rootMargin:'-10% 0px -70% 0px'});Object.keys(checkpointNames).forEach(id=>{const el=document.getElementById(id);if(el)checkpoints.observe(el);});}

</script>
