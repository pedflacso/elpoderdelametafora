<section class="chapter" id="reconstruccion" aria-labelledby="revised-title"><h2 id="revised-title">${esc(C.reconstruct.title)}</h2><p class="lead">${esc(C.reconstruct.intro)}</p><div class="workspace"><h3>${esc(C.reconstruct.firstTitle)}</h3><p class="first-idea" id="first-idea">${esc(C.reconstruct.noFirst)}</p></div><div class="notebook">${note('revised',C.reconstruct.label,C.reconstruct.placeholder)}<p>${esc(C.reconstruct.prompt)}</p><div class="chosen-pieces" role="group" aria-label="Piezas que sostienen tu explicación">${[{id:'voces',title:'Voces'},...C.evidence].map(e=>`<button data-support="${e.id}" aria-pressed="false">${esc(e.title)}</button>`).join('')}</div><button id="reveal" aria-expanded="false" aria-controls="possible">${esc(C.reconstruct.reveal)}</button><div id="possible" class="reconstruction" hidden><h3>Una explicación posible</h3><p>${esc(C.reconstruct.answer)}</p><p>${esc(C.reconstruct.caution)}</p><p class="small">${esc(C.reconstruct.reflection)}</p></div></div><nav class="compact-links"><a href="#eclosion">${esc(C.reconstruct.return)}</a><a href="#reencuentro">${esc(C.reconstruct.next)}</a></nav></section>
<section class="chapter curation" id="reencuentro" aria-labelledby="curation-title"><h2 id="curation-title">${esc(C.curation.title)}</h2><div class="body-copy">${paras(C.curation.paragraphs)}</div><details><summary>Qué significa seleccionar, relacionar y disponer</summary>${C.curation.ops.map(o=>`<p><strong>${esc(o.title)}</strong><br>${esc(o.body)}</p>`).join('')}</details><div class="choices"><article class="choice"><h3>Cuando la escucha conduce</h3><p>Las voces aparecen en una secuencia. Las pausas invitan a consultar evidencias antes de reconstruir.</p></article><article class="choice"><h3>Cuando la exploración conduce</h3><p>Elegís qué pieza abrir, cuáles reunir sobre la mesa y qué relación construir entre ellas.</p></article></div><p>${esc(C.curation.translation)}</p><p class="quote">${esc(C.curation.question)}</p><details><summary>${esc(C.curation.more)}</summary><div class="table-scroll"><table><thead><tr><th scope="col">Decisión</th><th scope="col">Podcast</th><th scope="col">Artefacto interactivo</th></tr></thead><tbody>${C.reunion.dimensions.map(d=>`<tr><th scope="row">${esc(d.title)}</th><td>${esc(d.podcast)}</td><td>${esc(d.artefacto)}</td></tr>`).join('')}</tbody></table></div></details><a class="button-link" href="#eclosion">${esc(C.curation.other)}</a></section>
<section class="chapter" id="mariposa" aria-labelledby="test-title"><p class="eyebrow">Mariposa</p><h2 id="test-title">${esc(C.test.title)}</h2><p class="lead">${esc(C.test.intro)}</p><div class="story-grid">${svgPanel('wings','final-form','Las mismas partes permiten reconocer una forma.')}<div><div class="connection-options" role="group" aria-label="Relaciones del objeto de aprendizaje">${C.connections.map((c,i)=>`<button data-connection="${i}" aria-pressed="false" aria-controls="connection-view">${esc(c.title)}</button>`).join('')}</div><div id="connection-view" class="connection-view"><p>Elegí una relación para mirar qué significa en este recorrido.</p></div><div class="scene-text"><h3 class="panel-title">${esc(C.test.selfTitle)}</h3><p>${esc(C.test.self)}</p><p>${esc(C.test.selfQuestion)}</p></div></div></div><div class="testing"><h3 class="panel-title">${esc(C.test.consistencyTitle)}</h3><p>${esc(C.test.lead)}</p><div class="choices">${C.consistency.scenarios.map(scenario).join('')}</div><p>${esc(C.test.criterion)}</p><details><summary>${esc(C.test.more)}</summary><ul>${C.consistency.questions.map(q=>`<li>${esc(q)}</li>`).join('')}</ul><p>${esc(C.consistency.criterion)}</p></details></div></section>
<section class="chapter" id="tu-objeto" aria-labelledby="transfer-title"><h2 id="transfer-title">${esc(C.transfer.title)}</h2><p class="lead">${esc(C.transfer.intro)}</p><div class="notebook">${note('need',C.transfer.need)}${note('relation',C.transfer.relation)}</div><div class="choices">${C.transfer.choices.map(c=>`<article class="choice"><h3>${esc(c.title)}</h3><p>${esc(c.body)}</p><button class="secondary" data-transfer="${c.id}" aria-pressed="false" aria-controls="transfer-fields">${esc(c.title)}</button></article>`).join('')}</div><div id="transfer-fields"></div><details class="review"><summary>${esc(C.transfer.feedbackTitle)}</summary><p>${esc(C.transfer.feedback)}</p></details><div class="export-actions"><button id="copy">${esc(C.transfer.copy)}</button><button class="secondary" id="download">${esc(C.transfer.download)}</button></div><p role="status" id="export-status" class="small"></p><div id="lms-links"></div><p>${esc(C.transfer.ending)}</p><p class="quote">${esc(C.transfer.question)}</p></section>
<section class="ending"><details><summary>${esc(C.ui.bibliography)}</summary><p>${esc(C.ui.sources)}</p></details><nav class="compact-links"><a href="#larva">Volver al comienzo</a><a href="#reconstruccion">Revisar mi explicación</a><a href="#tu-objeto">Revisar mi decisión</a></nav></section>`;
/* La primera interpretación vuelve al final. Las notas son de sesión, no se envían. */
for(const id of ['initial','revised','need','relation'])document.getElementById(id).addEventListener('input',e=>{state[id]=e.target.value;if(id==='initial')document.getElementById('first-idea').textContent=state.initial||C.reconstruct.noFirst;});
function getPiece(id){if(id.startsWith('voz')){const v=C.voices[Number(id.slice(3))];return {id,title:v.name,body:v.text,source:'Testimonio del caso',audio:v.audio};}return C.evidence.find(e=>e.id===id);}
function pieceHtml(p){return `<h3>${esc(p.title)}</h3><p>${esc(p.body)}</p>${p.audio?audio(p.audio,p.title):''}${p.question?`<p>${esc(p.question)}</p>`:''}<p class="small">${esc(p.source)}</p>`;}
function buttons(ids){return `<div class="piece-list" role="group" aria-label="Piezas del caso">${ids.map(id=>{const p=getPiece(id);return `<button data-piece="${id}" aria-pressed="${state.active===id}" aria-controls="piece-open">${esc(p.title)}${state.visited.has(id)?' · '+C.exploration.visited:''}</button>`;}).join('')}</div>`;}
function showPiece(id){state.active=id;state.visited.add(id);const p=getPiece(id);document.querySelectorAll('#piece-open audio').forEach(a=>a.pause());document.getElementById('piece-open').innerHTML=pieceHtml(p)+(state.path==='exploracion'?`<button data-pin="${id}" aria-pressed="${state.pinned.includes(id)}" aria-controls="pinned-pieces">${esc(state.pinned.includes(id)?C.exploration.unpin:C.exploration.pin)}</button>`:'');document.querySelectorAll('[data-piece]').forEach(b=>{const p=getPiece(b.dataset.piece);b.textContent=p.title+(state.visited.has(p.id)?' · '+C.exploration.visited:'');b.setAttribute('aria-pressed',p.id===id);});}
function renderTable(){document.getElementById('pinned-pieces').innerHTML=state.pinned.length?state.pinned.map(id=>`<article class="pinned-piece">${pieceHtml(getPiece(id))}<button class="secondary" data-remove="${id}">${esc(C.exploration.unpin)} · ${esc(getPiece(id).title)}</button></article>`).join(''):`<p>${esc(C.exploration.empty)}</p>`;}
function renderBranch(){document.querySelectorAll('#branch audio').forEach(a=>a.pause());const b=document.getElementById('branch');if(state.path==='podcast'){const i=state.step,p=C.podcast.steps[i];let content;if(p.voice!==undefined){const v=C.voices[p.voice];content=`<h3>${esc(v.name)}</h3>${audio(v.audio,v.name)}<blockquote>«${esc(v.text)}»</blockquote><p class="pause">${esc(p.question)}</p>`;}else content=`<h3>${esc(p.title)}</h3><p>${esc(p.body)}</p>${buttons(['consigna','ubicacion','registro'])}<div class="piece-open" id="piece-open"><p>Elegí un material para consultarlo.</p></div>`;
b.innerHTML=`<div class="branch"><h3 class="panel-title" id="branch-title" tabindex="-1">${esc(C.podcast.title)}</h3><p>${esc(C.podcast.intro)}</p><nav class="episode-dots" aria-label="Pausas de la escucha">${C.podcast.steps.map((p,j)=>`<button data-step="${j}" aria-pressed="${j===i}" aria-controls="episode">${j<3?'Voz '+(j+1):'Evidencias'}</button>`).join('')}</nav><div class="episode" id="episode">${content}</div><div class="episode-nav"><button class="secondary" id="episode-back" ${i===0?'disabled':''}>${esc(C.podcast.back)}</button>${i===3?`<a class="button-link" href="#reconstruccion">${esc(p.next)}</a>`:`<button id="episode-next">${esc(p.next)}</button>`}</div><a href="#eclosion">Elegir otro camino</a></div>`;if(i===3&&state.active&&['consigna','ubicacion','registro'].includes(state.active))showPiece(state.active);
}else{b.innerHTML=`<div class="branch"><h3 class="panel-title" id="branch-title" tabindex="-1">${esc(C.exploration.title)}</h3><p>${esc(C.exploration.intro)}</p><div class="surface"><div>${buttons(['voz0','voz1','voz2','consigna','ubicacion','registro','guia'])}</div><div class="piece-open" id="piece-open"><p>Elegí una pieza para abrirla.</p></div></div><section class="compare-table"><h3>${esc(C.exploration.tableTitle)}</h3><p>${esc(C.exploration.hint)}</p><div id="pinned-pieces" class="pinned-grid"></div><p role="status" id="pin-status" class="small"></p></section><nav class="compact-links"><a class="button-link" href="#reconstruccion">${esc(C.exploration.next)}</a><a href="#eclosion">Elegir otro camino</a></nav></div>`;renderTable();if(state.active)showPiece(state.active);}}
/* Los botones deciden. El scroll nunca revela respuestas ni elige una rama. */
document.addEventListener('click',e=>{const path=e.target.closest('[data-path]');if(path){state.path=path.dataset.path;renderBranch();document.getElementById('path-status').textContent=C.ui.selected+' · '+C.choose.paths.find(p=>p.id===state.path).label;document.querySelectorAll('[data-path]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.path===state.path));const h=document.getElementById('branch-title');h.focus({preventScroll:true});h.scrollIntoView({block:'start'});return;}const step=e.target.closest('[data-step]');if(step){state.step=Number(step.dataset.step);renderBranch();document.querySelector(`[data-step="${state.step}"]`).focus({preventScroll:true});return;}if(e.target.id==='episode-next'||e.target.id==='episode-back'){state.step+=e.target.id==='episode-next'?1:-1;renderBranch();const h=document.getElementById('branch-title');h.focus({preventScroll:true});h.scrollIntoView({block:'start'});return;}const piece=e.target.closest('[data-piece]');if(piece){showPiece(piece.dataset.piece);return;}const pin=e.target.closest('[data-pin]'),remove=e.target.closest('[data-remove]');if(pin||remove){const id=pin?pin.dataset.pin:remove.dataset.remove;if(state.pinned.includes(id))state.pinned=state.pinned.filter(p=>p!==id);else if(state.pinned.length===2){document.getElementById('pin-status').textContent=C.exploration.full;return;}else state.pinned.push(id);document.getElementById('pin-status').textContent='';renderTable();if(state.active)showPiece(state.active);if(pin)document.querySelector('[data-pin]')?.focus({preventScroll:true});else document.querySelector(`[data-piece="${id}"]`)?.focus({preventScroll:true});return;}const support=e.target.closest('[data-support]');if(support){const id=support.dataset.support;state.support.has(id)?state.support.delete(id):state.support.add(id);support.setAttribute('aria-pressed',state.support.has(id));return;}const connection=e.target.closest('[data-connection]');if(connection){const i=Number(connection.dataset.connection),c=C.connections[i];document.querySelectorAll('[data-connection]').forEach(b=>b.setAttribute('aria-pressed',Number(b.dataset.connection)===i));document.getElementById('connection-view').innerHTML=`<h3>${esc(c.title)}</h3><p>${esc(c.body)}</p>`;document.querySelectorAll('#final-form .segment').forEach(g=>{const lit=c.pair.includes(Number(g.dataset.component));g.classList.toggle('dim',!lit);g.classList.toggle('lit',lit);});return;}
const scenario=e.target.closest('[data-scenario]');if(scenario){const i=Number(scenario.dataset.scenario),removed=scenario.getAttribute('aria-pressed')!=='true',c=C.consistency.scenarios[i];scenario.setAttribute('aria-pressed',removed);scenario.textContent=removed?C.consistency.restore:C.consistency.remove;document.getElementById('scenario-text-'+i).textContent=removed?c.after:c.before;document.getElementById('scenario-consequence-'+i).hidden=!removed;const model=document.getElementById('model-'+i);model.classList.toggle(i===0?'surface-removed':'structure-removed',removed);model.querySelectorAll('.model-piece').forEach((el,j)=>el.textContent=(removed?['Materiales','Consulta','Actividad']:['Indicios','Contraste','Explicación'])[j]);return;}const transfer=e.target.closest('[data-transfer]');if(transfer){state.choice=transfer.dataset.transfer;renderTransfer();}});
document.getElementById('reveal').onclick=e=>{state.revealed=!state.revealed;document.getElementById('possible').hidden=!state.revealed;e.currentTarget.setAttribute('aria-expanded',state.revealed);e.currentTarget.textContent=state.revealed?C.reconstruct.hide:C.reconstruct.reveal;};
function renderTransfer(){const c=C.transfer.choices.find(c=>c.id===state.choice);document.querySelectorAll('[data-transfer]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.transfer===state.choice));document.getElementById('transfer-fields').innerHTML=`<div class="notebook transfer-fields"><h3 class="panel-title">${esc(c.title)}</h3>${c.fields.map((f,i)=>`<label for="field-${i}">${esc(f)}</label><textarea id="field-${i}" data-field="${i}">${esc(state[c.id][i]||'')}</textarea>`).join('')}<p class="small">${esc(C.ui.privacy)}</p></div>`;document.getElementById('field-0').focus({preventScroll:true});}
document.addEventListener('input',e=>{if(e.target.matches('[data-field]'))state[state.choice][Number(e.target.dataset.field)]=e.target.value;});
function decision(){const c=C.transfer.choices.find(c=>c.id===state.choice);return [C.transfer.need+'\n'+state.need,C.transfer.relation+'\n'+state.relation,c?c.title:'Decisión todavía abierta',...(c?c.fields.map((f,i)=>f+'\n'+(state[c.id][i]||'')):[])].join('\n\n');}
function allNotes(){return ['El poder de la metáfora',C.initial.label+'\n'+state.initial,C.reconstruct.label+'\n'+state.revised,'Piezas que sostienen mi explicación\n'+[...state.support].map(id=>id==='voces'?'Voces':getPiece(id).title).join(', '),'Piezas reunidas en la mesa\n'+state.pinned.map(id=>getPiece(id).title).join(', '),'Mi decisión\n'+decision()].join('\n\n');}
document.getElementById('copy').onclick=async()=>{const status=document.getElementById('export-status');if(!state.choice){status.textContent=C.ui.chooseFirst;return;}const text=decision();try{await navigator.clipboard.writeText(text);status.textContent=C.ui.copied;}catch{let area=document.getElementById('manual-copy');if(!area){area=document.createElement('textarea');area.id='manual-copy';area.setAttribute('aria-label','Tu decisión para copiar');status.after(area);}area.value=text;area.focus();area.select();status.textContent=C.ui.copyFail;}};
document.getElementById('download').onclick=()=>{const url=URL.createObjectURL(new Blob([allNotes()],{type:'text/plain;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='mi-recorrido-metafora.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);};
/* Enlaces reales del campus. No se crean destinos de ejemplo. */
const lms=document.getElementById('lms-links');let hasBitacora=false;for(const id of ['bitacora','aula']){try{const url=new URL(C.transfer.urls[id]);if(['http:','https:'].includes(url.protocol)){const a=document.createElement('a');a.href=url.href;a.textContent=C.ui[id];a.className='button-link';lms.append(a);if(id==='bitacora')hasBitacora=true;}}catch{}}if(!hasBitacora){const p=document.createElement('p');p.className='small';p.textContent=C.transfer.missing;lms.append(p);}
const media=matchMedia('(prefers-reduced-motion: reduce)'),motion=document.getElementById('motion');let reducedByUser=false;
function applyMotion(){const reduce=media.matches||reducedByUser;document.body.classList.toggle('no-motion',reduce);motion.setAttribute('aria-pressed',reduce);motion.setAttribute('aria-disabled',media.matches);motion.textContent=reduce?C.ui.reduced:C.ui.motion;}
motion.onclick=()=>{if(media.matches)return;reducedByUser=!reducedByUser;applyMotion();};media.addEventListener('change',applyMotion);applyMotion();
/* Los estados visuales conservan las mismas formas. La lectura también funciona sin movimiento. */
if('IntersectionObserver' in window){const stages=new IntersectionObserver(entries=>{for(const entry of entries)if(entry.isIntersecting){document.querySelector('#thinking-form svg').outerHTML=organism(entry.target.dataset.form,'thinking-form-form');}},{rootMargin:'-15% 0px -40% 0px'});document.querySelectorAll('[data-form]').forEach(e=>stages.observe(e));const phase=new IntersectionObserver(entries=>{for(const entry of entries)if(entry.isIntersecting)document.querySelectorAll('.phase a').forEach(a=>{if(a.getAttribute('href')==='#'+entry.target.id)a.setAttribute('aria-current','location');else a.removeAttribute('aria-current');});},{rootMargin:'-10% 0px -60% 0px'});document.querySelectorAll('#larva,#crisalida,#eclosion,#mariposa').forEach(e=>phase.observe(e));}
document.addEventListener('play',e=>{if(e.target.tagName==='AUDIO')document.querySelectorAll('audio').forEach(a=>{if(a!==e.target)a.pause();});},true);

</script></body></html>
